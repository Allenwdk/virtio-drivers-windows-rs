name: Build virtio_wddm_rs (arm64)

# 构建 Windows GPU 内核驱动 virtio_wddm_rs.sys（ARM64）。
#
# windows-2025 runner 自带的 Windows SDK 不含内核组件（Include\<ver>\km、
# Lib\<ver>\km\arm64），而编译 KMD 必须要有它们，所以这里先用 winget 装上
# 与 runner SDK 同 build 号的 WDK。
#
# 之后把 util/ewdk 需要的四个路径写进仓库根的 ewdk.env：上游
# util/ewdk/src/lib.rs 通过 `bash -c "source ../ewdk.env; ..."` 读取它，
# GitHub 的 windows runner 上 PATH 里的 bash 是 Git Bash，source 能正常
# 工作（Windows 本地默认的 C:\Windows\System32\bash.exe 是 WSL 启动器，
# source 出来的变量传不回调用方，所以本地要另配环境变量）。

on:
  workflow_dispatch:
  push:
    branches: [wingpu, droidvm, master]

jobs:
  build:
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly with rust-src
        shell: pwsh
        run: |
          rustup toolchain install nightly --profile minimal --component rust-src
          rustup target add aarch64-pc-windows-msvc --toolchain nightly

      - name: Install WDK matching the runner SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sdkRoot = "${env:ProgramFiles(x86)}\Windows Kits\10"

          $sdkVer = Get-ChildItem "$sdkRoot\Include" -Directory |
                    Where-Object { $_.Name -match '^10\.0\.\d+\.\d+$' } |
                    Sort-Object Name -Descending | Select-Object -First 1
          if (-not $sdkVer) {
            Get-ChildItem "$sdkRoot\Include" -Directory -ErrorAction SilentlyContinue | Select-Object Name
            throw "No Windows SDK version directory under $sdkRoot\Include"
          }
          $ver = $sdkVer.Name
          Write-Host "runner SDK version = $ver"

          $kmHeader = "$sdkRoot\Include\$ver\km\ntddk.h"
          if (Test-Path $kmHeader) {
            Write-Host "WDK kernel headers already present, skipping install"
          } else {
            # winget 包 ID 跟随 SDK 的 build 号：10.0.26100.0 -> Microsoft.WindowsWDK.10.0.26100
            $build = ($ver -split '\.')[2]
            $pkgId = "Microsoft.WindowsWDK.10.0.$build"
            Write-Host "installing $pkgId ..."
            winget install --id $pkgId --exact --silent `
              --accept-source-agreements --accept-package-agreements --disable-interactivity
            Write-Host "winget exit code: $LASTEXITCODE"
          }

          if (-not (Test-Path $kmHeader)) {
            Write-Host "--- contents of $sdkRoot\Include\$ver ---"
            Get-ChildItem "$sdkRoot\Include\$ver" -Directory -ErrorAction SilentlyContinue | Select-Object Name
            throw "WDK kernel headers missing: $kmHeader"
          }

          $kmLib = "$sdkRoot\Lib\$ver\km\arm64\ntoskrnl.lib"
          if (-not (Test-Path $kmLib)) {
            Write-Host "--- contents of $sdkRoot\Lib\$ver ---"
            Get-ChildItem "$sdkRoot\Lib\$ver" -Directory -ErrorAction SilentlyContinue | Select-Object Name
            throw "WDK arm64 kernel libs missing: $kmLib"
          }
          Write-Host "WDK ready: $kmHeader / $kmLib"

          "WINSDKVER=$ver" >> $env:GITHUB_ENV

      - name: Write ewdk.env and vfs-overlay.json
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sdkRoot = "${env:ProgramFiles(x86)}\Windows Kits\10"
          $root = $PWD.Path.Replace('\','/')

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found" }
          $vs = & $vswhere -latest -property installationPath
          if (-not $vs) { throw "vswhere returned no installationPath" }

          $msvc = Get-ChildItem "$vs\VC\Tools\MSVC" -Directory |
                  Sort-Object Name -Descending | Select-Object -First 1
          if (-not $msvc) { throw "No MSVC version dir under $vs\VC\Tools\MSVC" }

          $llvm = "$vs\VC\Tools\Llvm\x64\bin"
          if (Test-Path $llvm) { $llvm >> $env:GITHUB_PATH }

          # util/ewdk 固定传 -vfsoverlay，所以这个文件必须存在。上游是在
          # Linux 上用 clang-cl-linux 的 generate_vfs.py 生成路径映射用的，
          # 在 Windows 上原生 clang-cl 不需要映射，空 overlay 即可。
          $overlay = '{"version": 0, "case-sensitive": false, "roots": []}'
          [System.IO.File]::WriteAllText("$root/vfs-overlay.json", $overlay)

          # 必须写成 LF：bash source 时 CRLF 会把 \r 留在变量值里。
          $envLines = @(
            '#!/bin/bash',
            "export VCTOOLSVER=`"$($msvc.Name)`"",
            "export VCTOOLSDIR=`"$($msvc.FullName.Replace('\','/'))`"",
            "export WINSDKVER=`"$env:WINSDKVER`"",
            "export WINSDKDIR=`"$($sdkRoot.Replace('\','/'))`"",
            "export VFSOVERLAY=`"$root/vfs-overlay.json`""
          )
          [System.IO.File]::WriteAllText("$root/ewdk.env", ($envLines -join "`n") + "`n")

          Write-Host "--- ewdk.env ---"
          Get-Content "$root/ewdk.env"
          Write-Host "MSVC = $($msvc.Name)"
          Write-Host "LLVM = $llvm (exists: $(Test-Path $llvm))"

      - name: Verify ewdk.env is readable from bash
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "bash = $((Get-Command bash).Source)"
          Push-Location gpu-wddm
          bash -c 'source ../ewdk.env; echo "WINSDKDIR=$WINSDKDIR"; echo "WINSDKVER=$WINSDKVER"; echo "VCTOOLSDIR=$VCTOOLSDIR"; echo "VFSOVERLAY=$VFSOVERLAY"'
          Pop-Location

      - name: Build driver (release)
        run: cargo +nightly build --package virtio-gpu-wddm-rs --target aarch64-pc-windows-msvc --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: virtio_wddm_rs-arm64
          path: |
            target/aarch64-pc-windows-msvc/release/virtio_gpu_wddm_rs.dll
            target/aarch64-pc-windows-msvc/release/virtio_gpu_wddm_rs.pdb
          if-no-files-found: error
