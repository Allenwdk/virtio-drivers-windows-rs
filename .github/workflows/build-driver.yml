name: Build virtio_wddm_rs (arm64)

# 构建 Windows GPU 内核驱动 virtio_wddm_rs.sys（ARM64）。
#
# 这里不改动任何源码，只把构建环境准备好：
#
# 1. windows-2025 runner 自带的 Windows SDK 不含内核组件
#    （Include\<ver>\km、Lib\<ver>\km\arm64），所以先用 winget 装上与 runner
#    SDK 同 build 号的 WDK。
#
# 2. util/ewdk 从 ewdk.env 取四个路径（`bash -c "source ../ewdk.env;
#    source ../../ewdk.env; ..."`）。三个 crate 的 build script 深度不同：
#    wdk/ 和 gpu-wddm/ 的 ../ 就是仓库根，而 util/microseh/ 的 ../ 是 util/。
#    只要有一次 source 落空，GitHub runner 上的 Git Bash 就会以非 0 退出，
#    于是 Option::unwrap 直接 panic，所以在仓库根和 util/ 各放一份。
#
# 3. util/ewdk 在 vfs 模式下把 include 路径写成 /winsys/sdk/...（上游是给
#    Linux 上的 clang-cl 配 generate_vfs.py 用的），所以 vfs-overlay.json
#    必须真的把 /winsys/sdk 映射到本机的 Windows Kits 目录，不能是空文件。

on:
  workflow_dispatch:
  push:
    branches: [wingpu, droidvm, master]

jobs:
  build:
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly with rust-src
        shell: pwsh
        run: |
          rustup toolchain install nightly --profile minimal --component rust-src
          rustup target add aarch64-pc-windows-msvc --toolchain nightly

      - name: Install WDK matching the runner SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sdkRoot = "${env:ProgramFiles(x86)}\Windows Kits\10"

          $sdkVer = Get-ChildItem "$sdkRoot\Include" -Directory |
                    Where-Object { $_.Name -match '^10\.0\.\d+\.\d+$' } |
                    Sort-Object Name -Descending | Select-Object -First 1
          if (-not $sdkVer) { throw "No Windows SDK version directory under $sdkRoot\Include" }
          $ver = $sdkVer.Name
          Write-Host "runner SDK version = $ver"

          $kmHeader = "$sdkRoot\Include\$ver\km\ntddk.h"
          if (Test-Path $kmHeader) {
            Write-Host "WDK kernel headers already present, skipping install"
          } else {
            $build = ($ver -split '\.')[2]
            $pkgId = "Microsoft.WindowsWDK.10.0.$build"
            Write-Host "installing $pkgId ..."
            winget install --id $pkgId --exact --silent `
              --accept-source-agreements --accept-package-agreements --disable-interactivity
            Write-Host "winget exit code: $LASTEXITCODE"
          }

          if (-not (Test-Path $kmHeader)) {
            Get-ChildItem "$sdkRoot\Include\$ver" -Directory -ErrorAction SilentlyContinue | Select-Object Name
            throw "WDK kernel headers missing: $kmHeader"
          }
          $kmLib = "$sdkRoot\Lib\$ver\km\arm64\ntoskrnl.lib"
          if (-not (Test-Path $kmLib)) {
            Get-ChildItem "$sdkRoot\Lib\$ver" -Directory -ErrorAction SilentlyContinue | Select-Object Name
            throw "WDK arm64 kernel libs missing: $kmLib"
          }
          Write-Host "WDK ready: $kmHeader / $kmLib"

          "WINSDKVER=$ver" >> $env:GITHUB_ENV

      - name: Write ewdk.env and vfs-overlay.json
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sdkRootFwd = "${env:ProgramFiles(x86)}\Windows Kits\10".Replace('\','/')
          $root = $PWD.Path.Replace('\','/')

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found" }
          $vs = & $vswhere -latest -property installationPath
          if (-not $vs) { throw "vswhere returned no installationPath" }

          $msvc = Get-ChildItem "$vs\VC\Tools\MSVC" -Directory |
                  Sort-Object Name -Descending | Select-Object -First 1
          if (-not $msvc) { throw "No MSVC version dir under $vs\VC\Tools\MSVC" }

          $llvm = "$vs\VC\Tools\Llvm\x64\bin"
          if (Test-Path $llvm) { $llvm >> $env:GITHUB_PATH }

          $overlayLines = @(
            '{',
            '  "version": 0,',
            '  "case-sensitive": false,',
            '  "roots": [',
            '    {',
            '      "name": "/winsys/sdk",',
            '      "type": "directory",',
            '      "contents": [',
            '        {',
            '          "name": "Include",',
            '          "type": "directory",',
            '          "external-contents": "' + $sdkRootFwd + '/Include"',
            '        }',
            '      ]',
            '    }',
            '  ]',
            '}'
          )
          [System.IO.File]::WriteAllText("$root/vfs-overlay.json", ($overlayLines -join "`n") + "`n")

          $envLines = @(
            '#!/bin/bash',
            "export VCTOOLSVER=`"$($msvc.Name)`"",
            "export VCTOOLSDIR=`"$($msvc.FullName.Replace('\','/'))`"",
            "export WINSDKVER=`"$env:WINSDKVER`"",
            "export WINSDKDIR=`"$sdkRootFwd`"",
            "export VFSOVERLAY=`"$root/vfs-overlay.json`""
          )
          # 必须 LF：bash source 时 CRLF 会把 \r 带进变量值。
          $envText = ($envLines -join "`n") + "`n"
          [System.IO.File]::WriteAllText("$root/ewdk.env", $envText)
          [System.IO.File]::WriteAllText("$root/util/ewdk.env", $envText)

          Write-Host "--- ewdk.env ---"
          Get-Content "$root/ewdk.env"
          Write-Host "--- vfs-overlay.json ---"
          Get-Content "$root/vfs-overlay.json"
          Write-Host "MSVC = $($msvc.Name)"
          Write-Host "LLVM = $llvm (exists: $(Test-Path $llvm))"

          # 关键：util/ewdk 是用 Command::new("bash") 拉起 bash 的，而 Cargo /
          # rustc 是原生 Windows 程序，按 Windows 的 PATH 搜索，不走 Git Bash
          # 的 /usr/bin。Git 的 bash.exe 在 Git\bin，默认不在 Windows PATH 上，
          # 于是会命中 C:\Windows\System32\bash.exe（WSL 启动器）——runner 上没装
          # WSL 发行版，它起不来，lines 为空，unwrap 直接 panic。把 Git 的 bin
          # 和 usr\bin 前置到 PATH 最前面，确保解析到 Git Bash。
          $gitBash = "C:\Program Files\Git\bin\bash.exe"
          if (-not (Test-Path $gitBash)) { throw "Git Bash not found at $gitBash" }
          # 只前置 Git\bin：它是官方 wrapper，会初始化 MSYS 环境；直接跑
          # usr\bin\bash.exe 在原生 Windows 进程下发起的场景行为不一致。
          "C:/Program Files/Git/bin"     >> $env:GITHUB_PATH

      - name: Verify bash resolution and ewdk.env at every build-script depth
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # 在**真实的 Windows PATH** 上确认 Command::new("bash") 会解析到谁。
          # pwsh 的 Get-Command 会看 PowerShell 自己的解析规则，可能骗人，
          # 这里直接按 PATH 逐项找 bash.exe。
          $resolved = $null
          foreach ($p in $env:PATH -split ';') {
            if ([string]::IsNullOrWhiteSpace($p)) { continue }
            $candidate = Join-Path $p 'bash.exe'
            if (Test-Path $candidate) { $resolved = $candidate; break }
          }
          Write-Host "Command::new('bash') would resolve to: $resolved"
          if (-not $resolved) { throw "no bash.exe found on PATH" }
          if ($resolved -like '*System32*') {
            throw "PATH still resolves bash to the WSL launcher: $resolved"
          }

          foreach ($d in @('wdk','gpu-wddm','util/microseh')) {
            Push-Location $d
            $o = & bash -c 'source ../ewdk.env; source ../../ewdk.env; echo $VCTOOLSDIR; echo $WINSDKDIR; echo $WINSDKVER; echo $VFSOVERLAY' 2>&1
            $code = $LASTEXITCODE
            Pop-Location
            Write-Host "=== $d -> exit=$code ==="
            $o | ForEach-Object { Write-Host "| $_" }
            if ($code -ne 0) { throw "bash failed in $d" }
          }

      - name: Reveal what the ewdk crate actually gets from bash
        shell: pwsh
        run: |
          # util/ewdk 的 `bash -c ...` 链条只保留了 stdout，stderr 被丢掉，
          # 失败时只看得到一句 unwrap panic。这里在 **运行期**（不写回仓库）
          # 给 lib.rs 打一个打印补丁，把 status / stderr / stdout 全暴露出来。
          $ErrorActionPreference = "Stop"
          $f = "util/ewdk/src/lib.rs"

          # Windows 上 checkout 出来的 .rs 是 CRLF 行尾，直接按 `\n` 拼的锚点
          # 匹配不到（上一版就是这么把自己 throw 掉的）。先归一化成 LF 再处理，
          # 写回也保持 LF —— cargo 对 .rs 的行尾没有要求。
          $c = (Get-Content $f -Raw) -replace "`r`n", "`n"

          $needle = "        .output()`n        .ok()"
          if (-not $c.Contains($needle)) {
            Write-Host "=== lib.rs around .output() ==="
            ($c -split "`n" | Select-String -Pattern 'output|bash|ewdk.env' -Context 2,2) | Out-String
            throw "diagnostic patch anchor not found; lib.rs changed"
          }

          # 注意：这里不能用 here-string。PowerShell 要求 `'@` 终止符顶格，
          # 而 YAML 的块标量又要求所有行保持缩进 ≥ 10 空格，两者冲突会让
          # 整个 workflow 解析失败（run 直接不执行）。用数组拼换行符。
          $replacement = @(
            '        .output()',
            '        .inspect(|o| eprintln!("EWDK-DIAG status={:?} stdout=[{}] stderr=[{}]",',
            '            o.status,',
            '            String::from_utf8_lossy(&o.stdout),',
            '            String::from_utf8_lossy(&o.stderr)))',
            '        .ok()'
          ) -join "`n"
          $c = $c.Replace($needle, $replacement)
          [System.IO.File]::WriteAllText((Resolve-Path $f), $c)
          Write-Host "=== patched section ==="
          Get-Content $f | Select-String -Pattern "EWDK-DIAG" -Context 3,3 | Out-String

      - name: Where does cargo's PATH find bash
        shell: pwsh
        run: |
          Write-Host "where.exe bash:"
          where.exe bash 2>&1 | ForEach-Object { Write-Host "| $_" }
          Write-Host "Get-Command bash: $((Get-Command bash -ErrorAction SilentlyContinue).Source)"
          Write-Host "PATHEXT = $env:PATHEXT"

      - name: Build driver (release)
        run: cargo +nightly build --package virtio-gpu-wddm-rs --target aarch64-pc-windows-msvc --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: virtio_wddm_rs-arm64
          path: |
            target/aarch64-pc-windows-msvc/release/virtio_gpu_wddm_rs.dll
            target/aarch64-pc-windows-msvc/release/virtio_gpu_wddm_rs.pdb
          if-no-files-found: error
